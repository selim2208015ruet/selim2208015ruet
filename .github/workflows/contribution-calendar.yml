name: Generate Contribution Calendar

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate contribution calendar
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require("fs");

            const username = "selim2208015ruet";

            const now = new Date();
            const from = new Date(now);

            from.setUTCDate(from.getUTCDate() - 365);

            const query = `
              query($from: DateTime!, $to: DateTime!) {
                user(login: "${username}") {
                  contributionsCollection(from: $from, to: $to) {

                    contributionCalendar {
                      totalContributions

                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }

                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              from: from.toISOString(),
              to: now.toISOString()
            });

            const calendar =
              result.user.contributionsCollection.contributionCalendar;

            const days = [];

            for (const week of calendar.weeks) {
              for (const day of week.contributionDays) {
                days.push(day);
              }
            }

            const maxCount = Math.max(
              1,
              ...days.map(day => day.contributionCount)
            );

            const colors = [
              "#161B22",
              "#0E4429",
              "#006D32",
              "#26A641",
              "#39D353"
            ];

            const cellSize = 12;
            const gap = 4;
            const step = cellSize + gap;

            const labelWidth = 38;
            const topMargin = 38;
            const bottomMargin = 32;

            const weeks = calendar.weeks.length;

            const width =
              labelWidth + weeks * step + 20;

            const height =
              topMargin +
              7 * step +
              bottomMargin;

            function getLevel(count) {
              if (count === 0) return 0;

              const ratio =
                count / maxCount;

              if (ratio <= 0.25) return 1;
              if (ratio <= 0.50) return 2;
              if (ratio <= 0.75) return 3;

              return 4;
            }

            function escapeXml(text) {
              return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");
            }

            let svg = `
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="${width}"
                height="${height}"
                viewBox="0 0 ${width} ${height}"
              >

                <rect
                  x="0"
                  y="0"
                  width="${width}"
                  height="${height}"
                  rx="16"
                  fill="#0D1117"
                  stroke="#00FF88"
                  stroke-width="1"
                />

                <text
                  x="18"
                  y="23"
                  fill="#00FF88"
                  font-family="Arial, sans-serif"
                  font-size="12"
                  font-weight="700"
                >
                  Contributions in the last year
                </text>

                <text
                  x="${width - 18}"
                  y="23"
                  text-anchor="end"
                  fill="#8B949E"
                  font-family="monospace"
                  font-size="10"
                >
                  ${calendar.totalContributions} contributions
                </text>
            `;

            const weekdayLabels = [
              { name: "Mon", row: 1 },
              { name: "Wed", row: 3 },
              { name: "Fri", row: 5 }
            ];

            for (const label of weekdayLabels) {
              svg += `
                <text
                  x="8"
                  y="${topMargin + label.row * step + 9}"
                  fill="#8B949E"
                  font-family="monospace"
                  font-size="8"
                >
                  ${label.name}
                </text>
              `;
            }

            let lastMonth = "";

            days.forEach((day, index) => {

              const weekIndex =
                Math.floor(index / 7);

              const row =
                index % 7;

              const x =
                labelWidth +
                weekIndex * step;

              const y =
                topMargin +
                row * step;

              const date =
                new Date(day.date + "T00:00:00Z");

              const month =
                date.toLocaleString(
                  "en-US",
                  {
                    month: "short",
                    timeZone: "UTC"
                  }
                );

              if (
                row === 0 &&
                month !== lastMonth
              ) {
                svg += `
                  <text
                    x="${x}"
                    y="36"
                    fill="#8B949E"
                    font-family="monospace"
                    font-size="8"
                  >
                    ${month}
                  </text>
                `;

                lastMonth = month;
              }

              const count =
                day.contributionCount;

              const level =
                getLevel(count);

              const contributionLabel =
                count === 1
                  ? "1 contribution"
                  : `${count} contributions`;

              const tooltip =
                `${contributionLabel} on ${day.date}`;

              svg += `
                <rect
                  x="${x}"
                  y="${y}"
                  width="${cellSize}"
                  height="${cellSize}"
                  rx="3"
                  fill="${colors[level]}"
                  stroke="${count > 0 ? "#39D353" : "#21262D"}"
                  stroke-width="1"
                >
                  <title>${escapeXml(tooltip)}</title>
                </rect>
              `;
            });

            const legendY =
              height - 13;

            svg += `
              <text
                x="${labelWidth}"
                y="${legendY}"
                fill="#8B949E"
                font-family="monospace"
                font-size="8"
              >
                Less
              </text>
            `;

            for (let i = 0; i < 5; i++) {
              svg += `
                <rect
                  x="${labelWidth + 29 + i * 17}"
                  y="${legendY - 8}"
                  width="11"
                  height="11"
                  rx="3"
                  fill="${colors[i]}"
                />
              `;
            }

            svg += `
              <text
                x="${labelWidth + 120}"
                y="${legendY}"
                fill="#8B949E"
                font-family="monospace"
                font-size="8"
              >
                More
              </text>

              </svg>
            `;

            fs.mkdirSync("assets", {
              recursive: true
            });

            fs.writeFileSync(
              "assets/contribution-calendar.svg",
              svg
            );

      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-calendar.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update contribution calendar"
            git push
          fi
